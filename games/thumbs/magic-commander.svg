<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Magic Commander</title>
  <desc id="desc">Original placeholder art for a two-player Commander tool, made from the Games Planet colors. Not affiliated with Wizards of the Coast.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#3a1a10"/>
      <stop offset="45%" stop-color="#120c14"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="emberL" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd7a0"/>
      <stop offset="40%" stop-color="#e25a2a"/>
      <stop offset="85%" stop-color="#5a1c10"/>
      <stop offset="100%" stop-color="#5a1c10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberR" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe2a8"/>
      <stop offset="40%" stop-color="#d4742a"/>
      <stop offset="85%" stop-color="#3a1a10"/>
      <stop offset="100%" stop-color="#3a1a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(12,14,28,0.92)"/>
      <stop offset="100%" stop-color="rgba(8,8,16,0.96)"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d9b8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0c4a0"/>
      <stop offset="100%" stop-color="#f0d9b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bgGlow)"/>
  <circle cx="210" cy="160" r="130" fill="url(#emberL)" opacity=".55" filter="url(#soft)"/>
  <circle cx="760" cy="380" r="110" fill="url(#emberR)" opacity=".5" filter="url(#soft)"/>
  <circle cx="820" cy="90" r="36" fill="url(#emberL)" opacity=".7"/>
  <circle cx="140" cy="430" r="22" fill="url(#emberR)" opacity=".75"/>

  <!-- Card-style corner brackets -->
  <path d="M36 70 V36 H70" fill="none" stroke="rgba(240,217,184,0.55)" stroke-width="2" stroke-linecap="square"/>
  <path d="M890 70 V36 H856" fill="none" stroke="rgba(240,217,184,0.55)" stroke-width="2" stroke-linecap="square"/>
  <path d="M36 470 V504 H70" fill="none" stroke="rgba(240,217,184,0.55)" stroke-width="2" stroke-linecap="square"/>
  <path d="M890 470 V504 H856" fill="none" stroke="rgba(240,217,184,0.55)" stroke-width="2" stroke-linecap="square"/>

  <!-- Two facing play pads -->
  <g>
    <rect x="70" y="150" width="300" height="240" rx="16" fill="url(#pad)" stroke="rgba(240,217,184,0.28)" stroke-width="1.5"/>
    <text x="220" y="196" text-anchor="middle" fill="#f0c4a0" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="4">PLAYER 1</text>
    <text x="220" y="300" text-anchor="middle" fill="#fff" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="96" font-weight="200">40</text>
    <text x="220" y="348" text-anchor="middle" fill="rgba(226,221,240,0.7)" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="12" letter-spacing="3">LIFE</text>
  </g>
  <g>
    <rect x="590" y="150" width="300" height="240" rx="16" fill="url(#pad)" stroke="rgba(240,217,184,0.28)" stroke-width="1.5"/>
    <text x="740" y="196" text-anchor="middle" fill="#f0c4a0" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="4">PLAYER 2</text>
    <text x="740" y="300" text-anchor="middle" fill="#fff" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="96" font-weight="200">40</text>
    <text x="740" y="348" text-anchor="middle" fill="rgba(226,221,240,0.7)" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="12" letter-spacing="3">LIFE</text>
  </g>

  <rect x="478" y="170" width="4" height="200" rx="2" fill="url(#goldLine)"/>

  <text x="480" y="84" text-anchor="middle" fill="#fff" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="200" letter-spacing="10">MAGIC COMMANDER</text>
  <text x="480" y="114" text-anchor="middle" fill="#f0c4a0" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="6">TWO-PLAYER</text>

  <rect x="355" y="448" width="250" height="32" rx="16" fill="rgba(12,14,28,0.7)" stroke="rgba(234,210,102,0.7)" stroke-width="1"/>
  <text x="480" y="469" text-anchor="middle" fill="#ead266" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">WORK IN PROGRESS</text>
</svg>
